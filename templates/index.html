<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Enquiry Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="%23ffffff" opacity="0.05"/><circle cx="10" cy="50" r="0.5" fill="%23ffffff" opacity="0.05"/><circle cx="90" cy="50" r="0.5" fill="%23ffffff" opacity="0.05"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grain)"/></svg>');
            pointer-events: none;
            z-index: -1;
        }
        #chat-container {
            width: 100%;
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }
        #header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        #header::after {
            content: '🤖';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        #header h1 {
            margin: 0;
            font-size: 24px;
        }
        #chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background-color: #fafafa;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            #chat-container {
                max-width: 100%;
                border-radius: 10px;
            }
            #header {
                padding: 15px;
            }
            #header h1 {
                font-size: 20px;
            }
            #chat-box {
                height: 300px;
                padding: 10px;
            }
            .message {
                max-width: 85%;
                font-size: 14px;
            }
            #input-area {
                flex-direction: column;
                gap: 10px;
            }
            #message-input {
                margin-right: 0;
            }
            #send-button, #clear-button {
                padding: 12px;
                font-size: 16px;
            }
        }
        @media (max-width: 480px) {
            #header h1 {
                font-size: 18px;
            }
            #chat-box {
                height: 250px;
            }
            .message {
                font-size: 13px;
            }
        }
        .message {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .bot-message {
            background-color: #e9ecef;
            color: #333;
            margin-right: auto;
        }
        #input-area {
            display: flex;
            padding: 15px;
            background-color: white;
            border-top: 1px solid #ddd;
        }
        #message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            margin-right: 10px;
        }
        #send-button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
        #clear-button {
            padding: 10px 15px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 10px;
        }
        #clear-button:hover {
            background-color: #c82333;
        }
        .welcome-message {
            text-align: center;
            color: #666;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">
            <h1>🎓 Admission Enquiry Chatbot</h1>
            <p>Ask me anything about admissions!</p>
        </div>
        <div id="chat-box">
            <div class="welcome-message">
                Welcome! I'm here to help with your admission queries. Type your question below.
            </div>
        </div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type your admission-related question...">
            <button id="send-button">Send</button>
            <button id="clear-button">Clear</button>
        </div>
    </div>
    <script>
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const clearButton = document.getElementById('clear-button');

        sendButton.onclick = function() {
            const message = messageInput.value.trim();
            if (message) {
                // Add user message
                chatBox.innerHTML += `<div class="message user-message">${message}</div>`;
                messageInput.value = '';

                // Send message to server
                fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                })
                .then(response => response.json())
                .then(data => {
                    const reply = data.reply || `Error: ${data.error}`;
                    chatBox.innerHTML += `<div class="message bot-message">${reply}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .catch(error => {
                    chatBox.innerHTML += `<div class="message bot-message">Error: Unable to connect to the server.</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                });
            }
        };

        messageInput.onkeypress = function(e) {
            if (e.key === 'Enter') {
                sendButton.click();
            }
        };

        clearButton.onclick = function() {
            chatBox.innerHTML = '<div class="welcome-message">Welcome! I\'m here to help with your admission queries. Type your question below.</div>';
        };
    </script>
</body>
</html>
